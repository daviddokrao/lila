<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta content="noindex, nofollow" name="robots" />
    <meta name="theme-color" content="#070E22" />
    <title>Hết thời gian chờ • HungKings</title>
    <style>
      html, body { margin: 0; padding: 0; background: #070e22; color: #b6c2e2;
        font: 16px 'Noto Sans', system-ui, sans-serif; text-align: center; }
      main { max-width: 600px; margin: 0 auto; padding: 12vh 20px 40px; }
      svg { width: 72px; height: 72px; }
      h1 { font-family: Cambria, 'Palatino Linotype', Georgia, serif; font-weight: 400;
        font-style: italic; font-size: 28px; color: #eef2fb; margin: 24px 0 6px; }
      h1 + p.en-title { font-family: Cambria, Georgia, serif; font-style: italic;
        opacity: .55; margin: 0 0 24px; }
      p { line-height: 1.6; margin: 0 0 14px; }
      .en { opacity: .55; font-size: .92em; }
      a, a:visited { color: #ffbf00; }
      code { display: inline-block; background: #ffbf00; color: #241a00;
        padding: 2px 10px; border-radius: 6px; margin: .5em 0; word-break: break-all; }
      @media (prefers-reduced-motion: reduce) { .m-2, .m-3 { display: none; } }
      @media (prefers-color-scheme: light) {
        html, body { background: #f3f6fc; color: #45507a; }
        h1 { color: #16204a; }
        a, a:visited { color: #785900; }
      }
    </style>
  </head>
  <body>
    <main>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
        <g fill="none" stroke="#FFBF00" stroke-width="4.25">
          <path d="M 7.55 14.5 L 40.45 14.5 L 24 43 Z"/>
          <g class="m-2"><path d="M 7.55 14.5 L 40.45 14.5 L 24 43 Z"/>
            <animateTransform attributeName="transform" type="rotate"
              values="0 24 24; 0 24 24; 40 24 24; 40 24 24; 0 24 24" keyTimes="0; 0.44; 0.56; 0.88; 1"
              calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
              dur="18s" repeatCount="indefinite"/></g>
          <g class="m-3"><path d="M 7.55 14.5 L 40.45 14.5 L 24 43 Z"/>
            <animateTransform attributeName="transform" type="rotate"
              values="0 24 24; 0 24 24; 80 24 24; 80 24 24; 0 24 24" keyTimes="0; 0.44; 0.56; 0.88; 1"
              calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
              dur="18s" repeatCount="indefinite"/></g>
        </g>
      </svg>
      <h1>Máy chủ phản hồi quá chậm</h1>
      <p class="en-title">HungKings timed out</p>
      <p>Yêu cầu của bạn mất quá lâu. Trang sẽ tự thử lại trong giây lát.</p>
      <p class="en">Your request took too long. This page retries automatically.</p>
      
    </main>
    <script>setTimeout(function(){location.reload();}, 20000);</script>
  </body>
</html>
