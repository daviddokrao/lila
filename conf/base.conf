# The "secret" keys in here are for development purposes.
# None of them have ever been used in production.
# This also applies to former versions of this file, and to all other config files.

http.port = 9663
mongodb {
  uri = "mongodb://127.0.0.1:27017?appName=lila"
  yolo {
    uri = ${mongodb.uri}
    # uri = "mongodb://127.0.0.1:27010?appName=lila&connectTimeoutMS=800&rm.maxNonQueryableHeartbeats=9999"
  }
  mongo-async-driver.pekko = ${pekko}
  mongo-async-driver.pekko.actor.default-dispatcher.fork-join-executor.parallelism-max=32
}
net {
  domain = "localhost:9663"
  socket.domains = ["localhost:9664"]
  socket.alts = []
  asset.domain = ${net.domain}
  asset.base_url = "http://"${net.asset.domain}
  base_url = "http://"${net.domain}
  email = ""
  crawlable = false
  ratelimit = true
  prodDomain = "lichess.org"
  http.log = true
  stage.banner = false
  site.name = ${net.domain}
  home.v2 = false
  home.sidebar = false
  # HungKings: tắt tạm diễn đàn (ẩn mọi lối vào + chặn /forum). Mặc định BẬT để bản
  # dev/upstream không đổi hành vi; demo tắt bằng LILA_FORUM=false trong deploy/.env.
  forum.enabled = true
  # HungKings: tắt tạm broadcast/tiếp sóng (ẩn mọi lối vào + chặn /broadcast). Mặc định
  # BẬT để bản dev/upstream không đổi hành vi; demo tắt bằng LILA_BROADCAST=false.
  broadcast.enabled = true
  # HungKings: trang "Người bảo trợ" (/patron) + bảng so sánh gói (/features). Mọi nút
  # Donate đã gỡ khỏi site từ Mốc D, nhưng bản thân trang vẫn sống và vẫn mời người dùng
  # "trở thành Người bảo trợ" — một ngõ cụt không có đường thanh toán nào phía sau.
  # Mặc định BẬT để bản dev/upstream không đổi hành vi; demo tắt bằng LILA_PATRON=false.
  patron.enabled = true
  # HungKings: thư viện video (/video). Đây là bộ video do LICHESS tuyển chọn, toàn tiếng
  # Anh, và trang kéo ảnh thu nhỏ từ img.youtube.com — nội dung không phải của mình lại
  # thêm một phụ thuộc ngoài. Mặc định BẬT để dev/upstream không đổi hành vi; demo tắt
  # bằng LILA_VIDEO=false.
  video.enabled = true
  # HungKings: hệ điểm tích luỹ + đổi quà + giới thiệu 33% (service `hungkings-points`).
  # Mặc định TẮT — ngược với các cờ trên. Lý do: những cờ kia gác tính năng CÓ SẴN của
  # upstream nên mặc định bật là "không đổi hành vi"; còn cái này gác tính năng MỚI cần
  # một service ngoài, nên mặc định bật sẽ làm mọi bản dev/upstream trỏ vào một địa chỉ
  # không tồn tại. Demo bật bằng LILA_POINTS=true.
  points.enabled = false
  # HungKings: danh bạ HLV người thật (/coach). Sau khi gỡ 12 hồ sơ giả (seed rác), danh
  # bạ còn 0 người — hiện trang rỗng vô nghĩa mà không lối vào nào trỏ tới. Mặc định TẮT
  # (giống points.enabled ở trên: gác một trạng thái RỖNG thật của bản này, không phải
  # tính năng có sẵn cần giữ tương thích ngược). Bật lại khi có HLV thật đăng ký:
  # LILA_COACH_DIRECTORY=true + deploy, KHÔNG rebuild. ĐỪNG nhầm với LILA_COACH_INTERNAL_URL
  # (đích proxy của HLV AI /hlv) — hai tính năng khác nhau hoàn toàn.
  coach.enabled = false
  # HungKings: bật thì CSP khai thêm điểm cuối dev (127.0.0.1:3000, localhost:8666).
  # Mặc định BẬT cho máy dev; demo đặt LILA_LOCAL_DEV=false. Trước đây nhánh này chỉ rẽ
  # theo `!ctx.req.secure`, mà sau proxy thì live cũng `false` → dev endpoint lọt ra live.
  local_dev = true
}
play {
  application.loader = "lila.app.AppLoader"
  http {
    errorHandler = provided
    filters = provided
    parser.maxMemoryBuffer=512KiB
    session {
      cookieName = "lila2"
      maxAge = 3650 days
    }
    secret.key = "CiebwjgIM9cHQ;I?Xk:sfqDJ;BhIe:jsL?r=?IPF[saf>s^r0]?0grUq4>q?5mP^" # public (lila does not rely on cookie signing)
    parser.allowEmptyFiles = false
  }
  ws {
    useragent = ${net.domain}
    compressionEnabled = true
    timeout {
      connection = 5 seconds
      idle = 5 minutes
      request = 5 minutes
    }
  }
  server {
    # The maximum length of the HTTP headers. The most common effect of this is a restriction in cookie length, including
    # number of cookies and size of cookie values.
    max-header-size = 4096 # 8192
    netty {
      transport = "jdk"
      # The maximum length of the initial line. This effectively restricts the maximum length of a URL that the server will
      # accept, the initial line consists of the method (3-7 characters), the URL, and the HTTP version (8 characters),
      # including typical whitespace, the maximum URL length will be this number - 18.
      maxInitialLineLength = 2048 # 4096
    }
  }
  pekko {
    actor-system = lila
  }
}
pekko {
  actor {
    default-dispatcher.fork-join-executor {
      parallelism-max = 64
    }
  }
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = INFO
  # stdout-loglevel = INFO
  log-dead-letters-during-shutdown = off
  log-dead-letters = off
  coordinated-shutdown {
    phases {
      actor-system-terminate {
        timeout = 5s
      }
    }
  }
}
blocking-smtp-dispatcher {
  executor = "thread-pool-executor"
  thread-pool-executor {
    core-pool-size-min    = 8
    core-pool-size-max    = 64
